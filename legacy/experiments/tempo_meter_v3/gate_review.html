<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joljak · 첫 번째 확인</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f1f5f8;color:#182c40}main{max-width:1000px;margin:auto;padding:28px 20px}h1{font-size:1.7rem}section{background:white;border:1px solid #d6e1e9;border-radius:12px;padding:20px;margin:16px 0}.notice{border-left:5px solid #b7801b;padding:14px;background:#fff6df}button,select,textarea{font:inherit;padding:9px;border-radius:6px;border:1px solid #b7c7d6}button{cursor:pointer;background:#fff;color:#18476d}button.active{background:#1c5c86;color:white}button:disabled{opacity:.4;cursor:wait}select,textarea{width:100%;box-sizing:border-box}textarea{min-height:80px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}canvas{width:100%;height:160px;background:#f5f8fc}#seek{width:100%}.small{font-size:.9rem;color:#526477}a{color:#185a86}#error{color:#a02323;white-space:pre-wrap}#signatures{overflow-wrap:anywhere}
</style><main>
<h1>첫 번째 확인 · 어떤 해석을 정답으로 인정할까요?</h1>
<p class="notice">이 페이지는 <strong>채점 규칙을 검토하기 위한 비교</strong>입니다. 새 모델의 예측 결과가 아닙니다. 1·2번은 Wage War 실제 음원, 나머지는 합성 통제 예시입니다. 강한 클릭은 마디 시작, 중간 클릭은 명시된 내부 묶음, 작은 클릭은 4분음표입니다.</p>
<section><label for="case">검토할 예시</label><select id="case" disabled></select><h2 id="title"></h2><p id="description"></p><p id="status"></p><div class="row" id="variants"></div><p id="signatures" class="small"></p>
<canvas id="grid" width="1000" height="160" aria-label="위: 기준 마디, 아래: 비교 마디"></canvas><div class="row"><button id="play" disabled>재생</button><button id="restart" disabled>처음으로</button><label><input id="loop" type="checkbox" checked> 반복</label><span id="time"></span></div><input id="seek" type="range" min="0" max="1" value="0" step="0.01"><div class="row"><label>원곡 <input id="sourceGain" type="range" min="0" max="1" value="0.65" step="0.01"></label><label>클릭 <input id="clickGain" type="range" min="0" max="1" value="0.7" step="0.01"></label></div><p id="error" role="alert"></p></section>
<section><label for="decision">이 사례의 판정</label><select id="decision"><option value="unreviewed">미검토</option><option value="agree">제안된 허용/거부 판정에 동의</option><option value="disagree">판정 수정 필요</option><option value="uncertain">판단 보류</option></select><p><label for="note">문제가 들리는 시점이나 생각</label></p><textarea id="note" placeholder="예: 이 강박은 유지해야 하므로 두 마디를 합치면 안 됨"></textarea><div class="row"><button id="export">전체 메모 JSON 저장</button><span class="small">이 브라우저에 자동 저장됩니다. 메모가 정답 지도를 자동으로 바꾸지는 않습니다.</span></div></section><p><a href="review.json">비교 지도와 규칙 판정 보기</a> · <a href="../RESULTS.md">실행 결과</a> · <a href="../data-inventory.json">자료 현황</a> · <a href="../resources.json">자원 측정</a></p>
</main><script>
const $=id=>document.getElementById(id);let data,item,ctx,sourceBuffer,clickBuffer,nodes=[],gains=[],playing=false,position=0,started=0,variant=0,loadSerial=0;const buffers=new Map();
const noteKey=id=>'joljak-v3-gate1:r'+(data?.policy_revision||1)+':'+id;const fail=e=>{$('error').textContent=String(e)};
function pos(){if(!playing)return position;const p=Math.max(0,ctx.currentTime-started);return $('loop').checked?p%item.duration:Math.min(p,item.duration)}
function stop(){if(playing)position=pos();playing=false;for(const n of nodes){try{n.stop()}catch{}}nodes=[];gains=[];$('play').textContent='재생'}
async function decode(url){if(buffers.has(url))return buffers.get(url);const r=await fetch(url);if(!r.ok)throw Error(`오디오 로드 실패 ${r.status}`);const b=await ctx.decodeAudioData(await r.arrayBuffer());buffers.set(url,b);return b}
async function play(){await ctx.resume();if(position>=item.duration)position=0;const at=ctx.currentTime+.05;started=at-position;nodes=[sourceBuffer,clickBuffer].map((b,i)=>{const n=ctx.createBufferSource(),g=ctx.createGain();n.buffer=b;n.loop=$('loop').checked;n.loopStart=0;n.loopEnd=item.duration;g.gain.value=Number($(i?'clickGain':'sourceGain').value);n.connect(g).connect(ctx.destination);gains.push(g);n.start(at,position);return n});playing=true;$('play').textContent='일시정지'}
function save(){if(!item)return;localStorage.setItem(noteKey(item.id),JSON.stringify({case_id:item.id,policy_revision:data.policy_revision||1,rule_result:item.expected_rule_result,decision:$('decision').value,note:$('note').value,position_seconds:pos(),source_seconds:item.source_origin_seconds+pos(),policy_status:'review_only_not_reference_mutation'}))}
function draw(){const c=$('grid'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);item.tracks.forEach((t,i)=>{g.fillStyle='#41586e';g.fillText(i?'비교':'기준',6,25+i*75);t.bars.forEach((sec,j)=>{const x=Math.max(45,45+sec/item.duration*(c.width-50));g.strokeStyle=i?'#bd6439':'#23769c';g.beginPath();g.moveTo(x,30+i*75);g.lineTo(x,63+i*75);g.stroke();g.fillText(t.signatures[j],x+3,46+i*75)})})}
async function chooseVariant(i){const serial=++loadSerial;const resume=playing;stop();$('play').disabled=true;document.querySelectorAll('#variants button').forEach(b=>b.disabled=true);const next=await decode(item.tracks[i].click);if(serial!==loadSerial)return;variant=i;clickBuffer=next;document.querySelectorAll('#variants button').forEach((b,j)=>b.classList.toggle('active',i===j));$('signatures').textContent=item.tracks[i].signatures.join(' → ');$('play').disabled=false;document.querySelectorAll('#variants button').forEach(b=>b.disabled=false);if(resume)await play()}
async function chooseCase(index){save();stop();$('case').disabled=true;document.querySelectorAll('#variants button').forEach(b=>b.disabled=true);position=0;++loadSerial;$('play').disabled=true;$('restart').disabled=true;$('error').textContent='';item=data.cases[index];ctx=ctx||new AudioContext();sourceBuffer=await decode(item.source);$('title').textContent=item.title;$('description').textContent=item.description;$('status').textContent=({eligible:'제안 규칙 결과: 국소 재묶음 허용 후보 — 음악적 타당성은 검토 필요',reject:'제안 규칙 결과: 자동 동등 처리하지 않음',strict:'제안 규칙 결과: 같은 표기와 시간축'})[item.expected_rule_result];$('variants').replaceChildren();item.tracks.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.label;b.onclick=()=>chooseVariant(i).catch(fail);$('variants').append(b)});$('seek').max=item.duration;let note={};try{note=JSON.parse(localStorage.getItem(noteKey(item.id))||'{}')}catch{}$('decision').value=note.decision||'unreviewed';$('note').value=note.note||'';draw();await chooseVariant(0);$('restart').disabled=false;$('case').disabled=false}
$('play').onclick=()=>{if(playing)stop();else play().catch(fail)};$('restart').onclick=()=>{const resume=playing;stop();position=0;if(resume)play().catch(fail)};$('seek').oninput=()=>{const resume=playing;stop();position=Number($('seek').value);if(resume)play().catch(fail)};$('loop').onchange=()=>nodes.forEach(n=>n.loop=$('loop').checked);for(const [i,id] of ['sourceGain','clickGain'].entries())$(id).oninput=()=>{if(gains[i])gains[i].gain.value=Number($(id).value)};$('decision').onchange=save;$('note').oninput=save;
$('case').onchange=()=>chooseCase(Number($('case').value)).catch(fail);$('export').onclick=()=>{save();const entries=data.cases.map(c=>JSON.parse(localStorage.getItem(noteKey(c.id))||'null')).filter(Boolean);const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({kind:'gate1_owner_policy_review',policy_revision:data.policy_revision||1,reference_mutated:false,entries},null,2)],{type:'application/json'}));a.href=url;a.download='joljak-gate1-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function tick(){if(item){const p=pos();$('time').textContent=`${p.toFixed(1)} / ${item.duration.toFixed(1)}초 · 원곡 ${(item.source_origin_seconds+p).toFixed(2)}초`;$('seek').value=p;if(playing&&!$('loop').checked&&p>=item.duration)stop()}requestAnimationFrame(tick)}
fetch('review.json').then(r=>{if(!r.ok)throw Error('검토 자료를 불러올 수 없습니다');return r.json()}).then(async v=>{data=v;v.cases.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.title;$('case').append(o)});$('case').disabled=false;await chooseCase(0);tick()}).catch(fail);
</script></html>
