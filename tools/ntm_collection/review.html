<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>새 NTM 3곡 · 오프셋 검토</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif;background:#101821;color:#eef3f8}body{max-width:1080px;margin:30px auto;padding:0 20px 45px;line-height:1.6}h1{font-size:26px;margin:10px 0}.card{background:#192635;border:1px solid #39516a;border-radius:12px;padding:20px;margin:16px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select,input,textarea{font:inherit;color:inherit;background:#23384c;border:1px solid #6583a0;border-radius:6px;padding:8px}button{cursor:pointer}button.active{background:#256652}button:disabled{opacity:.5}select{width:min(100%,520px)}input[type=number]{width:145px}input[type=range]{accent-color:#65d6b2;padding:0}#seek{width:100%}textarea{width:100%;box-sizing:border-box;min-height:90px}.muted{color:#b2c1d0}.status{color:#91e3c5;min-height:25px}.error{color:#ffaeae}a{color:#84dfe3}.badge{background:#56462a;color:#ffe0a1;border-radius:8px;padding:5px 10px}canvas{width:100%;height:130px;background:#122031;border-radius:6px;cursor:pointer}.metric{font:21px ui-monospace,monospace}#details td,#details th{text-align:left;padding:6px 14px 6px 0;vertical-align:top}.files{display:flex;gap:15px;flex-wrap:wrap}small{font-size:13px}@media(max-width:600px){.card{padding:14px}body{padding:0 12px}h1{font-size:22px}}
</style>
<h1>새 NTM 3곡 · 오프셋 검토</h1>
<p class="muted">완성본과 제작 자료의 클릭을 겹쳐 듣고 위치를 조정하세요. 승인된 오프셋으로 저장한 세 곡입니다. 다른 위치도 비교해서 들을 수 있습니다.</p>
<div class="card"><label>곡 선택 <select id="song"></select></label><h2 id="title"></h2><p id="description"></p><span class="badge" id="approvalState">자료를 불러오는 중</span><table id="details"></table></div>
<div class="card">
 <div class="row"><button id="play" disabled>재생</button><span class="metric" id="position">0:00.000</span><span id="duration"></span></div>
 <input id="seek" type="range" min="0" step="0.01" value="0" aria-label="재생 위치">
 <div class="row" id="jumps"></div><p id="status" class="status">자료를 불러오는 중입니다.</p>
 <div class="row"><label>음원 <input id="music" type="range" min="0" max="0.8" step="0.01" value="0.4"></label><label>클릭 <input id="click" type="range" min="0" max="1" step="0.01" value="0.65"></label><label><input id="accents" type="checkbox" checked>마디 시작 강조</label></div>
 <p class="muted"><small>음원만 들으려면 클릭 음량을 0으로 조절하세요. Master는 고정하고 클릭만 이동합니다.</small></p>
</div>
<div class="card">
 <div class="row"><label>오프셋 <input id="offset" type="number" min="-600000" max="600000" step="0.1" value="0"> ms</label><button data-shift="-10">−10 ms</button><button data-shift="-1">−1 ms</button><button data-shift="1">+1 ms</button><button data-shift="10">+10 ms</button></div>
 <p id="selected"></p><div class="row"><button id="zero">원본 지도 · 0 ms</button><span id="candidates" class="row"></span></div>
 <p class="muted"><small>음수는 클릭을 앞당기고 양수는 늦춥니다. 제시한 시작값과 다른 위치를 비교해서 들을 수 있습니다.</small></p>
 <canvas id="timeline" aria-label="제작 지도와 현재 재생 위치"></canvas><p id="current"></p><p id="coverage" class="muted"></p>
</div>
<div class="card">
 <div class="row"><label><input id="intro" type="checkbox">초반 확인</label><label><input id="middle" type="checkbox">중반 확인</label><label><input id="end" type="checkbox">후반 확인</label></div>
 <p><textarea id="notes" placeholder="예: 선택한 값에서 전곡이 맞음 / 특정 구간에서 어긋남"></textarea></p>
 <div class="row"><button id="export">선택값·메모 JSON 저장</button><button id="exportClick">현재 클릭 WAV 저장</button></div>
 <p class="muted"><small>선택값은 이 브라우저에 자동 저장됩니다. 청취 후 확정할 오프셋을 채팅으로 알려주세요.</small></p>
 <div id="files" class="files"></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);let catalog,data,ctx,musicBuffer,clickBuffer,musicGain,clickGain,nodes=[],playing=false,loading=false,position=0,base=0,startedAt=0,offset=0,generation=0;
const ftime=t=>{const m=Math.floor(Math.max(0,t)/60);return `${m}:${(Math.max(0,t)-m*60).toFixed(3).padStart(6,'0')}`};
const status=(s,error=false)=>{$('status').textContent=s;$('status').classList.toggle('error',error)};
function tempoSummary(events){const values=events.map(e=>e.bpm);if(events.length<=8)return values.map(v=>v.toFixed(3)).join(' → ');const repeated=events.slice(1).filter((e,i)=>e.microseconds_per_quarter===events[i].microseconds_per_quarter).length;return `${Math.min(...values).toFixed(3)}–${Math.max(...values).toFixed(3)} BPM · 원본 템포 기록 ${events.length}개 (${repeated}개는 직전 값 반복)`}
function currentPosition(){return playing?Math.min(data.duration_seconds,base+Math.max(0,ctx.currentTime-startedAt)):position}
function stop(){if(data)position=currentPosition();playing=false;for(const n of nodes){try{n.stop()}catch{}n.disconnect()}nodes=[];$('play').textContent='재생'}
function start(){if(!musicBuffer||!clickBuffer)return;if(position>=data.duration_seconds-.001)position=0;base=position;startedAt=ctx.currentTime+.06;const m=ctx.createBufferSource(),c=ctx.createBufferSource();m.buffer=musicBuffer;c.buffer=clickBuffer;m.connect(musicGain);c.connect(clickGain);m.start(startedAt,position);c.start(startedAt,position);nodes=[m,c];playing=true;$('play').textContent='일시 정지';status('Master와 현재 클릭을 함께 재생 중입니다.')}
function seek(t){const resume=playing;stop();position=Math.max(0,Math.min(data.duration_seconds,t));if(resume)start();draw()}
function clickSamples(){const out=new Float32Array(data.sample_frames),length=Math.floor(data.sample_rate*.025+.5),normal=new Float32Array(length),accent=new Float32Array(length);for(let i=0;i<length;i++){let t=i/data.sample_rate;normal[i]=.18*Math.exp(-220*t)*Math.cos(2*Math.PI*1500*t);accent[i]=.30*Math.exp(-220*t)*Math.cos(2*Math.PI*2200*t)}for(const e of data.quarters){let start=Math.floor((e.project_seconds+offset)*data.sample_rate+.5);if(start<0||start>=out.length)continue;const waveform=e.bar_start&&$('accents').checked?accent:normal;for(let i=0;i<length&&start+i<out.length;i++)out[start+i]+=waveform[i]}return out}
function rebuild(){if(!ctx)return;clickBuffer=ctx.createBuffer(1,data.sample_frames,data.sample_rate);clickBuffer.copyToChannel(clickSamples(),0)}
function key(){return `joljak-ntm-new3:${data.audio_sha256}:${data.clock_sha256}:${data.acceptance_revision||"proposal"}`}
function noteState(){return {offset_seconds:offset,notes:$('notes').value,reviewed_regions:{intro:$('intro').checked,middle:$('middle').checked,end:$('end').checked}}}
function remember(){if(data)localStorage.setItem(key(),JSON.stringify(noteState()))}
function change(value,clearRegions=true){if(!Number.isFinite(value)||Math.abs(value)>600)return;const resume=playing;stop();offset=value;if(clearRegions)for(const id of ['intro','middle','end'])$(id).checked=false;$('offset').value=(value*1000).toFixed(4);$('selected').textContent=`현재 선택: ${(offset*1000).toFixed(4)} ms`;const approved=data.human_alignment_accepted===true&&Math.abs(offset-data.accepted_offset_seconds)<1e-10;$('approvalState').textContent=approved?'오프셋 확정 완료':'미확정 오프셋';rebuild();remember();draw();if(resume)start()}
async function loadAudio(){if(musicBuffer)return;loading=true;$('play').disabled=true;const token=generation,source=data;status('전체 Master를 불러오는 중입니다.');try{ctx ||= new AudioContext({sampleRate:source.sample_rate});const activeContext=ctx;await activeContext.resume();let response=await fetch(source.audio);if(!response.ok)throw Error('Master를 불러오지 못했습니다.');const bytes=await response.arrayBuffer();if(token!==generation)return;const decoded=await activeContext.decodeAudioData(bytes);if(token!==generation)return;if(decoded.sampleRate!==source.sample_rate||decoded.length!==source.sample_frames||decoded.numberOfChannels!==source.channels)throw Error('음원 재생 길이가 저장된 원본과 다릅니다.');musicBuffer=decoded;musicGain=activeContext.createGain();clickGain=activeContext.createGain();musicGain.connect(activeContext.destination);clickGain.connect(activeContext.destination);musicGain.gain.value=Number($('music').value);clickGain.gain.value=Number($('click').value);rebuild();status('재생 준비가 완료됐습니다.')}finally{if(token===generation){loading=false;$('play').disabled=false}}}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportClick(){const x=clickSamples(),view=new DataView(new ArrayBuffer(44+x.length*2)),str=(p,t)=>{for(let i=0;i<t.length;i++)view.setUint8(p+i,t.charCodeAt(i))};str(0,'RIFF');view.setUint32(4,36+x.length*2,true);str(8,'WAVE');str(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,data.sample_rate,true);view.setUint32(28,data.sample_rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);str(36,'data');view.setUint32(40,x.length*2,true);for(let i=0;i<x.length;i++)view.setInt16(44+i*2,Math.max(-32768,Math.min(32767,Math.round(x[i]*32768))),true);download(new Blob([view.buffer],{type:'audio/wav'}),`${data.slug}-click-${(offset*1000).toFixed(4)}ms.wav`)}
function draw(){if(!data)return;let canvas=$('timeline'),ratio=devicePixelRatio||1,w=Math.max(300,canvas.clientWidth),h=130;if(canvas.width!==Math.round(w*ratio)){canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio)}let g=canvas.getContext('2d');g.setTransform(ratio,0,0,ratio,0,0);g.clearRect(0,0,w,h);const left=40,right=w-15,x=t=>left+(right-left)*t/data.duration_seconds;g.fillStyle='#adc0d1';g.font='12px system-ui';g.fillText('BPM',5,25);g.fillText('박자',5,86);const rates=data.tempo_events.map(e=>e.bpm),lo=Math.min(...rates)-10,hi=Math.max(...rates)+10,y=b=>60-(b-lo)/(hi-lo)*43;for(let i=0;i<data.tempo_events.length;i++){let e=data.tempo_events[i],begin=Math.max(0,e.project_seconds+offset),end=Math.min(data.duration_seconds,(data.tempo_events[i+1]?.project_seconds??data.project_end_seconds)+offset);if(end<=begin)continue;g.strokeStyle='#75dbbc';g.lineWidth=2;g.beginPath();g.moveTo(x(begin),y(e.bpm));g.lineTo(x(end),y(e.bpm));g.stroke()}for(let i=0;i<data.meter_events.length;i++){let e=data.meter_events[i],begin=Math.max(0,e.project_seconds+offset),end=Math.min(data.duration_seconds,(data.meter_events[i+1]?.project_seconds??data.project_end_seconds)+offset);if(end<=begin)continue;g.fillStyle='#344f76';g.fillRect(x(begin),72,x(end)-x(begin),24);g.fillStyle='#fff';g.fillText(`${e.numerator}/${e.denominator}`,x(begin)+4,88)}g.strokeStyle='#ffdf82';g.beginPath();g.moveTo(x(currentPosition()),0);g.lineTo(x(currentPosition()),105);g.stroke();g.fillStyle='#adc0d1';for(let i=0;i<=4;i++){let t=data.duration_seconds*i/4;g.fillText(ftime(t).split('.')[0],Math.min(w-55,x(t)),123)}let p=currentPosition()-offset,tempo=[...data.tempo_events].reverse().find(e=>e.project_seconds<=p),meter=[...data.meter_events].reverse().find(e=>e.project_seconds<=p);$('current').textContent=`현재 지도: ${tempo?tempo.bpm.toFixed(3)+' BPM':'범위 밖'} · ${meter?meter.numerator+'/'+meter.denominator:'박자 미확인'}`;let begin=Math.max(0,offset),end=Math.min(data.duration_seconds,data.project_end_seconds+offset);$('coverage').textContent=`현재 지도 범위: ${ftime(begin)}–${ftime(Math.max(begin,end))}. 범위 밖은 참조 미확인 구간입니다.`}
async function selectSong(index){stop();const token=++generation;loading=false;$('play').disabled=true;const oldContext=ctx;ctx=null;if(oldContext)await oldContext.close();if(token!==generation)return;musicBuffer=clickBuffer=musicGain=clickGain=null;const nextData=await(await fetch(catalog.songs[index].review)).json();if(token!==generation)return;data=nextData;position=0;$('title').textContent=data.title;$('description').textContent=data.description;$('duration').textContent='/ '+ftime(data.duration_seconds);$('seek').max=data.duration_seconds;$('seek').value=0;$('play').disabled=false;$('details').replaceChildren();for(const [label,value] of [['제작 지도',data.clock_label],['BPM',tempoSummary(data.tempo_events)],['박자',[...new Set(data.meter_events.map(e=>`${e.numerator}/${e.denominator}`))].join(' · ')]]){let tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.textContent=label;td.textContent=value;tr.append(th,td);$('details').append(tr)}$('jumps').replaceChildren();for(const [label,t] of [['초반',0],['중반',data.duration_seconds/2],['후반',Math.max(0,data.duration_seconds-25)]]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>seek(t);$('jumps').append(b)}$('candidates').replaceChildren();for(const e of data.candidates){let b=document.createElement('button');b.textContent=e.label;b.onclick=()=>change(e.offset_seconds);$('candidates').append(b)}$('files').replaceChildren();for(const [label,href] of [['원본 Master',data.original_audio],['제작 지도 JSON',data.raw_clock],['승인 지도 JSON',data.accepted_map],['승인 클릭 WAV',data.approved_click],['승인 합본 WAV',data.approved_audition],['승인 기록',data.acceptance_record],['검토 자료 JSON',catalog.songs[index].review],...data.clock_files.map(e=>[e.label,e.path])].filter(e=>!!e[1])){let a=document.createElement('a');a.textContent=label;a.href=href;a.download='';$('files').append(a)}let saved;try{saved=JSON.parse(localStorage.getItem(key()))}catch{}$('notes').value=saved?.notes||'';for(const id of ['intro','middle','end'])$(id).checked=!!saved?.reviewed_regions?.[id];change(saved?.offset_seconds??data.initial_offset_seconds,false);status(data.human_alignment_accepted?'승인된 오프셋을 불러왔습니다.':'오프셋을 조정하며 전곡을 확인해주세요.');window.__ntmData=data}
$('song').onchange=()=>selectSong(Number($('song').value));$('play').onclick=async()=>{const token=generation;try{if(playing){stop();return}if(loading)return;await loadAudio();if(token!==generation||!musicBuffer||!ctx)return;await ctx.resume();if(token===generation)start()}catch(e){if(token===generation)status(e.message,true)}};$('seek').oninput=()=>seek(Number($('seek').value));$('offset').onchange=()=>change(Number($('offset').value)/1000);$('zero').onclick=()=>change(0);for(const b of document.querySelectorAll('[data-shift]'))b.onclick=()=>change(offset+Number(b.dataset.shift)/1000);$('music').oninput=()=>{if(musicGain)musicGain.gain.value=Number($('music').value)};$('click').oninput=()=>{if(clickGain)clickGain.gain.value=Number($('click').value)};$('accents').onchange=()=>{let resume=playing;stop();rebuild();if(resume)start()};for(const id of ['notes','intro','middle','end'])$(id).oninput=remember;$('export').onclick=()=>download(new Blob([JSON.stringify({kind:'owner_offset_selection_not_automatic_acceptance',created_at_utc:new Date().toISOString(),title:data.title,slug:data.slug,master_sha256:data.audio_sha256,source_clock_sha256:data.clock_sha256,transform:'t_master = t_project + offset_seconds',...noteState(),human_alignment_accepted:data.human_alignment_accepted===true&&Math.abs(offset-data.accepted_offset_seconds)<1e-10,saved_accepted_offset_seconds:data.accepted_offset_seconds??null},null,2)+'\n'],{type:'application/json'}),`${data.slug}-offset-review.json`);$('exportClick').onclick=exportClick;$('timeline').onclick=e=>seek(Math.max(0,Math.min(data.duration_seconds,(e.offsetX-40)/($('timeline').clientWidth-55)*data.duration_seconds)));window.addEventListener('resize',draw);function frame(){if(data){let t=currentPosition();if(playing&&t>=data.duration_seconds){stop();position=data.duration_seconds}$('position').textContent=ftime(t);if(document.activeElement!==$('seek'))$('seek').value=t;draw()}requestAnimationFrame(frame)}
(async()=>{try{catalog=await(await fetch('index-data.json')).json();for(let i=0;i<catalog.songs.length;i++){let o=document.createElement('option');o.value=i;o.textContent=catalog.songs[i].title;$('song').append(o)}await selectSong(0);requestAnimationFrame(frame)}catch(e){status('자료를 불러오지 못했습니다: '+e.message,true)}})();
</script>
</html>
