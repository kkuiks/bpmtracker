<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 곡의 템포 지도 듣기</title>
<style>
:root{color-scheme:light;--ink:#172637;--muted:#536477;--line:#ced9e3;--blue:#175ea0;--paper:#fff;--bg:#eef3f7;--amber:#805218}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans CJK KR",sans-serif}main{max-width:1150px;margin:auto;padding:30px 24px 60px}h1{font-size:1.8rem;margin:0 0 8px}h2{font-size:1.1rem;margin:0 0 12px}p{margin:8px 0}.muted{color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin:18px 0}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.choice{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:13px 10px;cursor:pointer}.choice.active{border-color:var(--blue);background:#edf6ff}.choice input{margin:7px 2px 0 0}.choice strong{display:block}.choice small{display:block;color:var(--muted);font-size:.82rem;line-height:1.5;margin-top:5px}button,input,a{font:inherit}button{border:1px solid #b8c9d8;border-radius:7px;background:#f4f8fb;color:var(--ink);padding:8px 13px;cursor:pointer}button:hover{background:#e6f0f8}button:disabled{cursor:wait;opacity:.5}.primary{background:var(--blue);color:white;border-color:var(--blue);min-width:100px}.primary:hover{background:#114d85}button[aria-pressed=true]{background:#d8eaf8;border-color:var(--blue)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e49e32;outline-offset:3px}.transport{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.time{font-variant-numeric:tabular-nums;font-size:1.18rem;min-width:180px}.status{min-height:1.6em;color:var(--muted)}.status[data-error=true]{color:#a52222}.timeline{width:100%;height:125px;display:block;border-radius:7px;background:#f5f8fb}.detail{height:100px;margin-top:10px}.seek{width:100%;margin:12px 0}.volumes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px 0 0}.volume{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.volume input{min-width:90px;flex:1}.volume output{width:40px;font-variant-numeric:tabular-nums}.volume label{font-weight:600}.coverage{border-left:4px solid #29816a;background:#edf8f4;padding:9px 12px;margin:14px 0 0}.coverage[data-verified=false]{border-color:#bc7e22;background:#fff5e5;color:var(--amber)}.regions{display:flex;flex-wrap:wrap;gap:8px}.region.active{border-color:var(--blue);background:#e7f2ff}.loopline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;border-bottom:1px solid #e1e8ef;padding:7px 10px}th{font-size:.9rem;color:var(--muted)}details{margin-top:14px}summary{cursor:pointer;color:var(--blue)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem;color:var(--muted)}.tag{display:inline-block;font-size:.82rem;border-radius:5px;background:#edf2f7;padding:2px 7px;margin-left:6px}a{color:var(--blue)}.fine{font-size:.87rem}.preparing{padding:20px}.hidden{display:none!important}@media(max-width:760px){main{padding:18px 12px 35px}.choices{grid-template-columns:1fr 1fr}.volumes{grid-template-columns:1fr}.panel{padding:14px}h1{font-size:1.5rem}}@media(max-width:430px){.choices{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><h1 id="title">한 곡의 템포 지도 듣기</h1><p class="muted">같은 재생 위치에서 지도를 바꾸며 원곡과 클릭의 간격을 들어보세요.</p></header>
<p id="loadStatus" class="status" role="status" aria-live="polite">음원과 비교 자료를 준비하고 있습니다.</p>
<section class="panel" aria-labelledby="choiceTitle"><h2 id="choiceTitle">비교할 지도</h2><div id="choices" class="choices" role="radiogroup" aria-label="클릭 지도 선택"></div><p id="variantDescription"></p><p id="variantStatus" class="fine muted"></p><p class="fine muted">네 지도는 같은 4분음표 클릭 소리와 음량을 사용합니다. 마디 강세는 넣지 않았습니다.</p></section>
<section class="panel" aria-label="음악과 클릭 재생">
<div class="transport"><button id="play" class="primary" disabled>재생</button><button id="pause" disabled>일시정지</button><button id="toStart" disabled>처음으로</button><output id="position" class="time" aria-label="현재 재생 위치" aria-live="off">00:00.000</output><span id="duration" class="muted"></span></div>
<input id="seek" class="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="재생 위치" disabled>
<canvas id="overview" class="timeline" role="img" aria-label="전체 음원 파형과 현재 위치"></canvas>
<canvas id="detail" class="timeline detail" role="img" aria-label="현재 위치 주변 파형과 선택한 지도의 4분음표 위치"></canvas>
<div class="volumes"><div class="volume"><label for="musicVolume">음악</label><input id="musicVolume" type="range" min="0" max="100" value="60" aria-label="음악 음량"><output id="musicLevel">60%</output><button id="musicMute" aria-pressed="false">음악 끄기</button></div><div class="volume"><label for="clickVolume">클릭</label><input id="clickVolume" type="range" min="0" max="100" value="50" aria-label="클릭 음량"><output id="clickLevel">50%</output><button id="clickMute" aria-pressed="false">클릭 끄기</button></div></div>
<p id="coverage" class="coverage" data-verified="true"></p>
</section>
<section class="panel" aria-labelledby="regionTitle"><h2 id="regionTitle">집중해서 들을 구간</h2><div id="sections" class="regions"></div><div class="loopline"><label><input id="loop" type="checkbox" disabled> 선택 구간 반복</label><span id="loopRange" class="muted fine"></span></div><p id="sectionDescription" class="fine muted"></p></section>
<section class="panel" aria-labelledby="mapTitle"><h2 id="mapTitle">선택한 지도의 템포</h2><div class="tablewrap"><table><thead><tr><th>시작</th><th>끝</th><th>BPM</th></tr></thead><tbody id="tempoRows"></tbody></table></div><p id="tempoNote" class="fine muted"></p><div id="variantDownloads" class="regions fine" aria-label="선택한 지도 파일"><a id="downloadClick" download>클릭 WAV 받기</a><a id="downloadMap" class="hidden" download>템포 지도 JSON 받기</a><a id="downloadMidi" class="hidden" download>템포 지도 MIDI 받기</a><a id="downloadSource" download>원본 instrumental WAV 받기</a></div><details><summary>지도와 기준 정보</summary><p id="referenceNote"></p><pre id="provenance"></pre><p id="sourceInfo" class="fine muted"></p><p id="originalClick" class="fine hidden"></p></details></section>
</main>
<script id="embeddedBundle" type="application/json">__ONE_SONG_BUNDLE__</script>
<script>
'use strict';
const $=id=>document.getElementById(id), FADE=.03, LEAD=.025;
const state={bundle:null,context:null,musicBuffer:null,cache:new Map(),pending:new Map(),activeId:null,pendingId:null,selectionToken:0,ready:false,playing:false,position:0,startPosition:0,startAt:0,musicVoice:null,clickVoices:new Set(),loop:{enabled:false,start:0,end:1},sectionIndex:0,musicMuted:false,clickMuted:false,scrubbing:false,startRecords:[],switchRecords:[],error:null};
let musicGain,clickGain,clickAnalyser,peaks=[];
const fmt=t=>{const ms=Math.round(Math.max(0,Number(t)||0)*1000);return `${String(Math.floor(ms/60000)).padStart(2,'0')}:${((ms%60000)/1000).toFixed(3).padStart(6,'0')}`};
const variant=()=>state.bundle.variants.find(v=>v.id===state.activeId);
function message(text,error=false){$('loadStatus').textContent=text;$('loadStatus').dataset.error=String(error);state.error=error?text:null}
function positionAt(at=state.context?.currentTime||0){if(!state.playing)return state.position;let p=state.startPosition+Math.max(0,at-state.startAt);if(state.loop.enabled&&p>=state.loop.end)p=state.loop.start+(p-state.loop.start)%(state.loop.end-state.loop.start);return Math.min(state.bundle.source.duration_seconds,p)}
function stopVoice(voice,at){try{voice.source.stop(at)}catch(_){} }
function stopAll(){const music=state.musicVoice;state.musicVoice=null;if(music)stopVoice(music);for(const v of state.clickVoices)stopVoice(v);state.clickVoices.clear()}
function loopProperties(source){source.loop=state.loop.enabled;source.loopStart=state.loop.start;source.loopEnd=state.loop.end}
function makeVoice(buffer,destination,when,offset,gain=1){const source=state.context.createBufferSource(),node=state.context.createGain();source.buffer=buffer;source.playbackRate.value=1;node.gain.value=gain;source.connect(node);node.connect(destination);loopProperties(source);source.start(when,offset);return{source,gain:node,startAt:when,offset}}
function startPair(offset){stopAll();const when=state.context.currentTime+LEAD;state.position=offset;state.startPosition=offset;state.startAt=when;state.playing=true;const music=makeVoice(state.musicBuffer,musicGain,when,offset);state.musicVoice=music;const click=makeVoice(state.cache.get(state.activeId),clickGain,when,offset);state.clickVoices.add(click);click.source.onended=()=>{state.clickVoices.delete(click);click.source.disconnect();click.gain.disconnect()};music.source.onended=()=>{music.source.disconnect();music.gain.disconnect();if(state.musicVoice===music&&!state.loop.enabled&&positionAt()>=state.bundle.source.duration_seconds-.015){state.position=state.bundle.source.duration_seconds;state.playing=false;stopAll();renderTransport()}};state.startRecords.push({musicAt:when,clickAt:when,musicOffset:offset,clickOffset:offset,variantId:state.activeId,loop:{...state.loop}});renderTransport()}
async function play(){if(!state.ready)return;await state.context.resume();if(state.playing)return;let p=state.position;if(p>=state.bundle.source.duration_seconds-.001)p=state.loop.enabled?state.loop.start:0;if(state.loop.enabled&&(p<state.loop.start||p>=state.loop.end))p=state.loop.start;await loadClick(state.activeId);startPair(p)}
function pause(){state.position=positionAt();state.playing=false;stopAll();renderTransport()}
function seek(seconds){let p=Math.max(0,Math.min(state.bundle.source.duration_seconds,Number(seconds)));if(state.loop.enabled&&(p<state.loop.start||p>=state.loop.end))p=state.loop.start;const was=state.playing;state.position=p;if(was&&p<state.bundle.source.duration_seconds)startPair(p);else{state.playing=false;stopAll();renderTransport()}}
function setLoop(enabled){const p=positionAt(),was=state.playing;state.playing=false;stopAll();state.loop.enabled=enabled;state.position=enabled&&(p<state.loop.start||p>=state.loop.end)?state.loop.start:p;if(was)startPair(state.position);renderTransport()}
function trimCache(){for(const id of state.cache.keys()){if(state.cache.size<=2)break;if(id!==state.activeId&&id!==state.pendingId)state.cache.delete(id)}}
async function checkedDecode(url,expectedHash,label){const response=await fetch(url);if(!response.ok)throw new Error(`${label} 파일을 불러오지 못했습니다 (${response.status}).`);const bytes=await response.arrayBuffer();if(expectedHash){const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),n=>n.toString(16).padStart(2,'0')).join('');if(hash!==expectedHash)throw new Error(`${label} 파일이 검증된 원본과 다릅니다.`)}const buffer=await state.context.decodeAudioData(bytes);const source=state.bundle.source;if(buffer.sampleRate!==source.sample_rate||buffer.length!==source.sample_frames)throw new Error(`${label}의 샘플레이트 또는 길이가 원본 음악과 다릅니다.`);return buffer}
async function loadClick(id){if(state.cache.has(id)){const value=state.cache.get(id);state.cache.delete(id);state.cache.set(id,value);return value}if(state.pending.has(id))return state.pending.get(id);const v=state.bundle.variants.find(v=>v.id===id);const promise=checkedDecode(v.click_url,v.click_sha256,'클릭').then(buffer=>{if(buffer.numberOfChannels!==1)throw new Error('비교 클릭은 모노 파일이어야 합니다.');state.cache.set(id,buffer);trimCache();return buffer}).finally(()=>state.pending.delete(id));state.pending.set(id,promise);return promise}
function fadeOut(voice,when){const gain=voice.gain.gain;if(gain.cancelAndHoldAtTime)gain.cancelAndHoldAtTime(when);else{gain.cancelScheduledValues(when);gain.setValueAtTime(gain.value,when)}gain.linearRampToValueAtTime(0,when+FADE);stopVoice(voice,when+FADE+.001)}
async function choose(id){const ticket=++state.selectionToken;state.pendingId=id;message('선택한 클릭을 준비하고 있습니다. 재생 위치는 유지됩니다.');renderChoices();try{const buffer=await loadClick(id);if(ticket!==state.selectionToken)return;const previous=state.activeId;state.activeId=id;state.pendingId=null;if(state.playing){const when=state.context.currentTime+LEAD,offset=positionAt(when);for(const voice of state.clickVoices)fadeOut(voice,when);const voice=makeVoice(buffer,clickGain,when,offset,0);voice.gain.gain.setValueAtTime(0,when);voice.gain.gain.linearRampToValueAtTime(1,when+FADE);state.clickVoices.add(voice);voice.source.onended=()=>{state.clickVoices.delete(voice);voice.source.disconnect();voice.gain.disconnect()};state.switchRecords.push({from:previous,to:id,when,offset,transportPositionAtSwitch:positionAt(when),musicStartAt:state.musicVoice?.startAt,fadeSeconds:FADE})}trimCache();renderVariant();message('준비되었습니다. 같은 위치에서 지도를 바꾸며 들어보세요.')}catch(error){if(ticket===state.selectionToken){state.pendingId=null;message(error.message,true);renderChoices()}}}
function renderChoices(){document.querySelectorAll('#choices input').forEach(input=>{input.checked=input.value===state.activeId;input.closest('label').classList.toggle('active',input.checked);input.disabled=!state.ready});if(state.pendingId)$('variantStatus').textContent='다른 지도를 준비 중입니다. 지금 들리는 클릭은 현재 선택 표시된 지도입니다.'}
function renderVariant(){renderChoices();const v=variant();$('downloadClick').href=v.click_url;$('downloadClick').download=v.id+'-quarter-click.wav';for(const [field,id,extension] of [['map_url','downloadMap','json'],['midi_url','downloadMidi','mid']]){const link=$(id);link.classList.toggle('hidden',!v[field]);if(v[field]){link.href=v[field];link.download=v.id+'-tempo-map.'+extension}else link.removeAttribute('href')}$('downloadSource').href=state.bundle.source.audio_url;$('downloadSource').download='original-instrumental.wav';$('variantDescription').textContent=v.description||'';$('variantStatus').textContent=v.status_label||({automatic_proposal:'자동 분석 · 검토용',anchor_assisted:'기준점 보조 · 검토용',creator_reference:'제작자 제공 기준 지도'}[v.status]||v.status||'검토용 지도');$('provenance').textContent=typeof v.provenance==='string'?v.provenance:JSON.stringify(v.provenance||{},null,2);$('tempoRows').replaceChildren();let segments=v.tempo_segments||[];if(!segments.length&&v.tempo_events)segments=v.tempo_events.map((e,i)=>({start_seconds:e.time_seconds??e.source_seconds,end_seconds:v.tempo_events[i+1]?.time_seconds??v.tempo_events[i+1]?.source_seconds??state.bundle.source.duration_seconds,bpm:e.bpm_quarter??e.bpm_after}));for(const s of segments){const row=document.createElement('tr');for(const text of [fmt(s.start_seconds??s.source_seconds),fmt(s.end_seconds??state.bundle.source.duration_seconds),Number(s.bpm??s.bpm_quarter??s.pulse_rate_per_minute).toFixed(3)]){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}$('tempoRows').append(row)}$('tempoNote').textContent=v.tempo_note||(!segments.length?'이 결과는 박 위치 목록입니다. 별도로 확정한 구간 템포 표는 없습니다.':'BPM 표와 실제 클릭 위치를 함께 확인하세요.');renderCoverage(positionAt())}
function renderCoverage(p){const c=variant()?.coverage||{start:0,end:state.bundle.source.duration_seconds};const inside=p>=c.start&&p<=c.end;$('coverage').dataset.verified=String(inside);$('coverage').textContent=inside?(c.verified_note||`제작자 클릭과 대조할 수 있는 구간: ${fmt(c.start)}–${fmt(c.end)}. 이 표시는 자동 분석의 정답 판정이 아닙니다.`):(c.note||'제작자 클릭 검증 범위 밖입니다. 이 위치의 지도는 끝부분까지 연장한 제안입니다.')}
function renderTransport(){if(!state.bundle)return;const p=positionAt();if(!state.scrubbing)$('position').textContent=fmt(p);if(!state.scrubbing)$('seek').value=p;$('play').textContent=state.playing?'재생 중':'재생';$('play').disabled=!state.ready||state.playing;$('pause').disabled=!state.ready||!state.playing;$('toStart').disabled=!state.ready;$('seek').disabled=!state.ready;$('loop').disabled=!state.ready;$('loop').checked=state.loop.enabled;renderCoverage(p)}
function section(index){const s=state.bundle.sections[index];state.sectionIndex=index;state.loop.start=s.start;state.loop.end=s.end;$('loopRange').textContent=`${fmt(s.start)}–${fmt(s.end)}`;$('sectionDescription').textContent=s.description||'';document.querySelectorAll('#sections button').forEach((button,i)=>button.classList.toggle('active',i===index));seek(s.start)}
function updateVolumes(){if(!musicGain)return;musicGain.gain.setValueAtTime(state.musicMuted?0:Number($('musicVolume').value)/100,state.context.currentTime);clickGain.gain.setValueAtTime(state.clickMuted?0:Number($('clickVolume').value)/100,state.context.currentTime);for(const [name,muted] of [['music',state.musicMuted],['click',state.clickMuted]]){$(name+'Level').textContent=$(name+'Volume').value+'%';$(name+'Mute').setAttribute('aria-pressed',String(muted));$(name+'Mute').textContent=(name==='music'?'음악':'클릭')+(muted?' 켜기':' 끄기')}}
function canvasSize(canvas){const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return{ctx,w,h}}
function draw(){if(!state.ready)return;const p=positionAt(),duration=state.bundle.source.duration_seconds;for(const [id,lo,hi] of [['overview',0,duration],['detail',Math.max(0,p-4),Math.min(duration,p+8)]]){const{ctx,w,h}=canvasSize($(id)),span=Math.max(.001,hi-lo),x=t=>(t-lo)/span*w;const coverage=variant().coverage;if(coverage&&hi>coverage.end){ctx.fillStyle='#fff0d8';ctx.fillRect(Math.max(0,x(coverage.end)),0,w,h)}ctx.strokeStyle='#91a9be';ctx.beginPath();if(id==='detail'){const data=state.musicBuffer.getChannelData(0),rate=state.musicBuffer.sampleRate;for(let pixel=0;pixel<w;pixel++){const first=Math.floor((lo+pixel/w*span)*rate),last=Math.min(data.length,Math.floor((lo+(pixel+1)/w*span)*rate)),step=Math.max(1,Math.floor((last-first)/20));let peak=0;for(let j=first;j<last;j+=step)peak=Math.max(peak,Math.abs(data[j]));const amplitude=peak*h*.38;ctx.moveTo(pixel,h/2-amplitude);ctx.lineTo(pixel,h/2+amplitude)}}else{for(let i=0;i<peaks.length;i++){const t=i/(peaks.length-1)*duration;if(t<lo||t>hi)continue;const amplitude=peaks[i]*(h*.38);ctx.moveTo(x(t),h/2-amplitude);ctx.lineTo(x(t),h/2+amplitude)}}ctx.stroke();ctx.strokeStyle=id==='detail'?'#175ea0':'#b6cadb';ctx.globalAlpha=id==='detail'?.8:.35;ctx.beginPath();for(const t of variant().beats_seconds||[])if(t>=lo&&t<=hi){ctx.moveTo(x(t),7);ctx.lineTo(x(t),h-7)}ctx.stroke();ctx.globalAlpha=1;ctx.strokeStyle='#c33b42';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x(p),0);ctx.lineTo(x(p),h);ctx.stroke();ctx.lineWidth=1;ctx.fillStyle='#40566b';ctx.font='12px sans-serif';ctx.fillText(fmt(lo),5,h-4);ctx.fillText(fmt(hi),Math.max(5,w-83),h-4)}}
function tick(){if(state.bundle){renderTransport();draw()}requestAnimationFrame(tick)}
function validateBundle(bundle){const s=bundle.source;if(!s||!Number.isInteger(s.sample_rate)||!Number.isInteger(s.sample_frames)||s.sample_frames<=0||Math.abs(s.duration_seconds-s.sample_frames/s.sample_rate)>1e-8||!/^[a-f0-9]{64}$/.test(s.sha256))throw new Error('원본 음원의 시간·해시 정보가 올바르지 않습니다.');if(!Array.isArray(bundle.variants)||bundle.variants.length!==4||new Set(bundle.variants.map(v=>v.id)).size!==4)throw new Error('서로 다른 네 개의 비교 지도가 필요합니다.');for(const v of bundle.variants){if(!v.click_url||!v.label||!Array.isArray(v.beats_seconds))throw new Error('비교 지도 파일 정보가 부족합니다.');for(let i=0;i<v.beats_seconds.length;i++){const t=v.beats_seconds[i];if(!Number.isFinite(t)||t<0||t>s.duration_seconds||(i&&t<=v.beats_seconds[i-1]))throw new Error('클릭 위치가 원본 시간축과 맞지 않습니다.')}}if(!bundle.sections?.length)bundle.sections=[{start:0,end:Math.min(20,s.duration_seconds),label:'시작 구간'}];for(const part of bundle.sections)if(!Number.isFinite(part.start)||!Number.isFinite(part.end)||part.start<0||part.end>s.duration_seconds||part.end<=part.start)throw new Error('반복 구간 범위가 올바르지 않습니다.');return bundle}
async function init(){try{const embedded=$('embeddedBundle').textContent.trim();state.bundle=validateBundle(embedded.startsWith('{')?JSON.parse(embedded):await(await fetch(new URLSearchParams(location.search).get('bundle')||'listening-bundle.json')).json());const b=state.bundle,s=b.source;state.activeId=b.default_variant_id&&b.variants.some(v=>v.id===b.default_variant_id)?b.default_variant_id:b.variants[1].id;state.context=new AudioContext({sampleRate:s.sample_rate});if(state.context.sampleRate!==s.sample_rate)throw new Error('이 브라우저에서 원본 샘플레이트로 재생을 준비하지 못했습니다.');musicGain=state.context.createGain();clickGain=state.context.createGain();clickAnalyser=state.context.createAnalyser();clickAnalyser.fftSize=2048;musicGain.connect(state.context.destination);clickGain.connect(clickAnalyser);clickAnalyser.connect(state.context.destination);updateVolumes();$('title').textContent=(s.label||'Light Has Come')+' · 클릭 비교';$('duration').textContent='/ '+fmt(s.duration_seconds);$('seek').max=s.duration_seconds;$('referenceNote').textContent=b.reference_note||'제작자가 제공한 MIDI 지도와 별도 클릭을 기준으로 비교합니다.';$('sourceInfo').textContent=`원본 ${s.sample_rate.toLocaleString()} Hz · ${s.sample_frames.toLocaleString()} 프레임 · 소스 시작 위치 그대로 재생`;
for(const v of b.variants){const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name='variant';input.value=v.id;input.disabled=true;input.addEventListener('change',()=>choose(v.id));const text=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=v.label;small.textContent=v.short_description||v.description||'';text.append(strong,small);label.append(input,text);$('choices').append(label)}
b.sections.forEach((s,i)=>{const button=document.createElement('button');button.className='region';button.textContent=s.label;button.disabled=true;button.addEventListener('click',()=>section(i));$('sections').append(button)});const original=b.original_creator_click;if(original?.audio_url){$('originalClick').classList.remove('hidden');const link=document.createElement('a');link.href=original.audio_url;link.download='creator-original-eighth-click.wav';link.textContent=original.label||'제작자 원본 클릭 파일 받기 (8분음표)';$('originalClick').append(link,document.createTextNode(' · '+(original.description||'네 지도 비교에 쓰는 4분음표 클릭과 박 단위가 다릅니다.')))}
renderVariant();const values=await Promise.all([checkedDecode(s.audio_url,s.sha256,'원곡'),loadClick(state.activeId)]);state.musicBuffer=values[0];const channel=state.musicBuffer.getChannelData(0),bins=Math.min(1400,channel.length);for(let i=0;i<bins;i++){const start=Math.floor(i*channel.length/bins),end=Math.floor((i+1)*channel.length/bins),step=Math.max(1,Math.floor((end-start)/48));let peak=0;for(let j=start;j<end;j+=step)peak=Math.max(peak,Math.abs(channel[j]));peaks.push(peak)}state.ready=true;document.querySelectorAll('#sections button').forEach(b=>b.disabled=false);section(0);renderVariant();renderTransport();message('준비되었습니다. 원곡은 바꾸지 않고 같은 위치에서 클릭 지도를 전환합니다.');requestAnimationFrame(tick)}catch(error){message(error.message+' 로컬 안내 주소에서 열었는지 확인해 주세요.',true)}}
$('play').addEventListener('click',()=>play().catch(e=>message(e.message,true)));$('pause').addEventListener('click',pause);$('toStart').addEventListener('click',()=>{if(state.loop.enabled){$('loop').checked=false;setLoop(false)}seek(0)});$('seek').addEventListener('input',()=>{state.scrubbing=true;$('position').textContent=fmt($('seek').value)});$('seek').addEventListener('change',()=>{state.scrubbing=false;seek($('seek').value)});$('loop').addEventListener('change',()=>setLoop($('loop').checked));for(const id of ['musicVolume','clickVolume'])$(id).addEventListener('input',updateVolumes);$('musicMute').addEventListener('click',()=>{state.musicMuted=!state.musicMuted;updateVolumes()});$('clickMute').addEventListener('click',()=>{state.clickMuted=!state.clickMuted;updateVolumes()});document.addEventListener('keydown',event=>{if(event.code==='Space'&&!/INPUT|BUTTON|TEXTAREA|SELECT|A/.test(event.target.tagName)){event.preventDefault();state.playing?pause():play().catch(e=>message(e.message,true))}});window.addEventListener('beforeunload',stopAll);
window.oneSongDebug={state,position:positionAt,choose,seek,play,pause,setLoop,clickPeak:()=>{if(!clickAnalyser)return 0;const samples=new Float32Array(clickAnalyser.fftSize);clickAnalyser.getFloatTimeDomainData(samples);return Math.max(...samples.map(Math.abs))},sourceFingerprint:()=>{if(!state.musicBuffer)return null;const x=state.musicBuffer.getChannelData(0);return{length:x.length,head:Array.from(x.subarray(0,64)),middle:Array.from(x.subarray(Math.floor(x.length/2),Math.floor(x.length/2)+64)),tail:Array.from(x.subarray(x.length-64))}},liveVoiceCount:()=>state.clickVoices.size};
init();
</script></body></html>
